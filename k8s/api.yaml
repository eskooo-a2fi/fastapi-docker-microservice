# Optional illustration: assumes a separately managed PostgreSQL database.
# Create a Kubernetes secret 'service-monitor-db' containing DATABASE_URL first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-monitor
  template:
    metadata:
      labels:
        app: service-monitor
    spec:
      containers:
        - name: api
          image: ghcr.io/REPLACE_WITH_YOUR_OWNER/service-monitor:REPLACE_WITH_TAG
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: service-monitor-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: service-monitor
spec:
  selector:
    app: service-monitor
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
