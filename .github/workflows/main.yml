name: Microservice CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: service_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d service_monitor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_test_only@127.0.0.1:5432/service_monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q
      - run: docker build --tag service-monitor:ci .
